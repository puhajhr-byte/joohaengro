<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프렙 카페 로그인 미리보기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#fff,#f7f9fb 60%);font:14px Inter,Pretendard,"Segoe UI",sans-serif;color:#191c1e;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:40px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 40px #0f172a0c}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#903f00;color:#fff;font-size:22px;font-weight:700}.eyebrow{margin:24px 0 10px;font-size:11px;letter-spacing:.1em;color:#903f00;font-weight:700}h1{font-size:32px;line-height:1.25;letter-spacing:-.04em;margin:0 0 12px}.muted{color:#64748b;line-height:1.6}.notice{margin:20px 0;padding:14px 16px;border-radius:7px;border:1px solid #fde68a;background:#fffbeb;color:#78350f;line-height:1.6;font-size:13px}label{display:block;margin:22px 0 7px;font-weight:650}input{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px}button{width:100%;height:44px;margin-top:18px;border:0;border-radius:6px;background:#903f00;color:#fff;font-weight:650;opacity:.5;cursor:not-allowed}.foot{margin:20px 0 0;text-align:center;color:#64748b;font-size:12px}.preview{margin-top:20px;padding-top:14px;border-top:1px solid #e2e8f0;color:#64748b;font-size:11px}@media(max-width:767px){.card{padding:28px 22px}h1{font-size:28px}}</style></head><body><main class="card"><div class="mark">P</div><p class="eyebrow">PREP CAFE · DAILY CLOSE</p><h1>마감 기록을<br>차분하게 정리하세요</h1><p class="muted">점주 이메일로 안전하게 로그인합니다.</p><section class="notice"><strong>설정 대기 중</strong><br>이메일 OTP 인증은 Supabase 프로젝트와 점주 계정 설정이 필요합니다. 현재 실제 로그인을 할 수 없습니다.</section><label for="email">점주 이메일</label><input id="email" type="email" placeholder="owner@example.com" disabled><button disabled>일회용 코드 받기</button><p class="foot">로그인 후 제공 샘플은 가상 예시로 표시됩니다.</p><p class="preview">로컬 UI 미리보기입니다. 인증·세션·데이터 저장을 수행하지 않습니다.</p></main></body></html>
